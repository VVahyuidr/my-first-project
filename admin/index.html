<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Messages</title>
  <style>
    body{font-family:Inter,system-ui,Arial;margin:0;padding:1rem;background:#f6f8fb;color:#111}
    .container{max-width:1000px;margin:0 auto}
    .msg{background:#fff;padding:1rem;border-radius:8px;border:1px solid #e6edf3;margin-bottom:.75rem}
    .meta{color:#6b7280;font-size:.9rem}
    .actions{margin-top:.5rem}
    .btn{padding:.45rem .7rem;background:#2563eb;color:#fff;border-radius:6px;border:0;cursor:pointer}
    .btn-ghost{background:#f3f7fb;color:#111;border:1px solid #e6edf3}
    .reply-area{width:100%;min-height:120px;padding:.6rem;border:1px solid #e6edf3;border-radius:6px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Messages</h1>
      <div>
        <button id="refresh" class="btn btn-ghost">Refresh</button>
      </div>
    </header>

    <div id="list"></div>
  </div>

  <script>
    async function load(){
      const res = await fetch('/api/messages');
      const msgs = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = '';
      if(msgs.length === 0) list.innerHTML = '<p>No messages yet.</p>';
      msgs.forEach(m => {
        const el = document.createElement('div'); el.className='msg';
        el.innerHTML = `<strong>${m.name}</strong> <div class="meta">${m.email} · ${new Date(m.createdAt).toLocaleString()} ${m.handled? ' · replied':' '}</div>
          <p>${m.message.replace(/\n/g,'<br>')}</p>
          <div class="actions">
            <button class="btn reply">Reply</button>
            <button class="btn btn-ghost" data-id="${m.id}" onclick="copyId(this)">Copy ID</button>
          </div>`;
        list.appendChild(el);
        const replyBtn = el.querySelector('.reply');
        replyBtn.addEventListener('click', ()=> openReply(m));
      });
    }

    function copyId(btn){ navigator.clipboard.writeText(btn.getAttribute('data-id')); btn.textContent='Copied'; setTimeout(()=>btn.textContent='Copy ID',1200); }

    function openReply(m){
      const replyBox = document.createElement('div');
      replyBox.innerHTML = `<h3>Reply to ${m.name} &lt;${m.email}&gt;</h3>
        <input id="sub" placeholder="Subject" style="width:100%;padding:.5rem;border:1px solid #e6edf3;border-radius:6px;margin:.5rem 0" value="Reply from Wahyu">
        <textarea id="body" class="reply-area" placeholder="Write your reply"></textarea>
        <div style="margin-top:.5rem"><button id="send" class="btn">Send Reply</button> <button id="cancel" class="btn btn-ghost">Cancel</button></div>`;
      const overlay = document.createElement('div');
      overlay.style.position='fixed';overlay.style.inset=0;overlay.style.background='rgba(2,6,23,.4)';overlay.style.display='flex';overlay.style.alignItems='center';overlay.style.justifyContent='center';overlay.style.zIndex=9999;
      const pane = document.createElement('div');pane.style.background='#fff';pane.style.padding='1rem';pane.style.borderRadius='8px';pane.style.width='90%';pane.style.maxWidth='720px';
      pane.appendChild(replyBox);
      overlay.appendChild(pane);
      document.body.appendChild(overlay);

      overlay.querySelector('#cancel').addEventListener('click', ()=> overlay.remove());
      overlay.querySelector('#send').addEventListener('click', async ()=>{
        const subject = overlay.querySelector('#sub').value;
        const body = overlay.querySelector('#body').value;
        if(!body){ alert('Please write a reply.'); return; }
        const resp = await fetch('/api/reply', { method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id: m.id, replySubject: subject, replyBody: body }) });
        const data = await resp.json();
        if(data.sent){ alert('Reply sent via SMTP.'); overlay.remove(); load(); }
        else if(data.mailto){ window.open(data.mailto, '_blank'); overlay.remove(); load(); }
        else { alert('Reply result: ' + JSON.stringify(data)); }
      });
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
